name: Compilar y Publicar LaTeX

on:
  push:
    branches:
      - main 

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Generar fecha/hora y renombrar PDF
        run: |
          MARCA_TIEMPO=$(date +'%Y-%m-%d_%H-%M')
          NUEVO_NOMBRE="TOPOAL_${MARCA_TIEMPO}.pdf"
          mv main.pdf $NUEVO_NOMBRE
          echo "PDF_NAME=$NUEVO_NOMBRE" >> $GITHUB_ENV
          echo "MARCA_TIEMPO=$MARCA_TIEMPO" >> $GITHUB_ENV

      - name: Crear Release y subir PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MARCA_TIEMPO }} 
          name: "Actualización ${{ env.MARCA_TIEMPO }}"
          files: ${{ env.PDF_NAME }}