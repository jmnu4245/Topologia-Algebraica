% Configuración de make4ht para la versión HTML de los apuntes (solo se usa en web/construir.sh).
% Se genera un único main.html (lo parte web/partir_html.py, igual en cualquier versión de TeX Live);
% las fórmulas se dibujan con MathJax y las figuras TikZ se convierten a SVG.
\Preamble{xhtml,mathjax,svg}

% Sin las opciones enhanced/breakable de las cajas: con ellas, make4ht dibuja algunas cajas enteras
% como imagen SVG (las que llevan listas o una demostración dentro). Los colores los pone estilo.css.
\tcbset{futuristicbase/.style={fonttitle=\bfseries}, sombra/.style={}}

% Con make4ht las etiquetas de las cajas no llegan al .aux, así que \cref saldría "??". En HTML,
% \cref{a,b} solo deja la marca [[REF:a,b]]; web/mapa/generar.py la cambia luego por enlaces
% ("teorema 3.5") porque sabe el número y la página de cada resultado.
\AddToHook{begindocument/end}{%
  \RenewDocumentCommand\cref{m}{\HCode{[[REF:#1]]}}%
  \RenewDocumentCommand\Cref{m}{\HCode{[[REFM:#1]]}}}

\Configure{AddCss}{estilo.css}
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width, initial-scale=1" />\Hnewline}}
\Configure{@BODY}{\HCode{<nav class="barra"><a href="index.html">Apuntes</a><a href="../mapa/">Mapa de resultados</a><a href="https://github.com/jmnu4245/Topologia-Algebraica/releases/latest">PDF</a><a href="https://github.com/jmnu4245/Topologia-Algebraica">GitHub</a></nav>\Hnewline}}

\begin{document}

% babel (español) activa ", < y > como atajos de comillas; romperían las etiquetas HTML de las macros.
\shorthandoff{"<>}


% En HTML no hay fondo de página ni la línea decorativa bajo cada sección.
\renewcommand{\neonrule}[1]{}

% Marcas y etiquetas: en el PDF son \fcolorbox, cuyo fondo se pierde en HTML (texto blanco sobre blanco).
\renewcommand{\marcadestacada}[1]{\HCode{<span class="marca marca-fuerte">&\#x2299;&\#x2009;}#1\HCode{</span>}}
\renewcommand{\marcasuave}[1]{\HCode{<span class="marca marca-suave">&\#x2299;&\#x2009;}#1\HCode{</span>}}
\renewcommand{\marcaE}{\HCode{<span class="marca marca-ej">}Ej.\ de clase\HCode{</span>}}
\renewcommand{\etiqueta}[2]{\HCode{<span class="etiqueta">}#2\HCode{</span>}}
\renewcommand{\fuenteclase}[1]{\HCode{<span class="etiqueta et-clase">}Resuelto en clase (#1)\HCode{</span>}}
\renewcommand{\fuenteexamen}[1]{\HCode{<span class="etiqueta et-examen">}Solución del profesor: examen #1\HCode{</span>}}
\renewcommand{\fuentepropia}{\HCode{<span class="etiqueta et-propia">}Solución propia\HCode{</span>}}
\renewcommand{\enexamen}[1]{\HCode{<span class="etiqueta et-cayo">}Cayó en examen: #1\HCode{</span>}}

\EndPreamble
